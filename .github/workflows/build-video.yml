name: Build sample mystery video
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install offline tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pillow
      - name: Render video
        run: python generator.py
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: mystery-video
          path: output/mystery.mp4
          retention-days: 7
