name: Build real footage video V2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install free tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts
      - name: Render neural voice and licensed footage
        run: python generator_v2.py
      - name: Upload video and credits
        uses: actions/upload-artifact@v4
        with:
          name: mystery-video-v2
          path: |
            output/mystery_v2.mp4
            output/CREDITS.json
          retention-days: 7
