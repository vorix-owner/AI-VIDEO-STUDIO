name: Milo Bella 16x9 framing proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framing-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          mkdir -p output
      - name: Render camera composition test
        run: blender -b -t 2 --python milo_bella_framing_test.py
      - name: Upload test frame
        uses: actions/upload-artifact@v4
        with:
          name: milo-bella-framing-proof
          path: output/milo_bella_framing_test.png
          retention-days: 7
